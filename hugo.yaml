baseURL: "https://nicklee7963.github.io/"
title: "Lee, Li-Hsiang"
theme: "PaperMod"
languageCode: "en-us"

enableInlineShortcodes: true

params:
  # 全站預設開啟數學支援
  math: true
  
  # 網站描述
  description: "NTU BIME | Robotics & AI Engineer | Amateur Boxer"
  defaultTheme: auto
  
  # 首頁 Profile Mode 設定
  profileMode:
    enabled: true
    title: "Lee, Li-Hsiang"
    subtitle: "NTU BIME | Robotics & AI Engineer | Amateur Boxer"
    imageUrl: "selfie.jpg"
    imageTitle: "My Profile"
    buttons:

  # 社群連結
  socialIcons:
    - name: github
      url: "https://github.com/nicklee7963"
    - name: instagram
      url: "https://www.instagram.com/_nick.active"
    - name: youtube
      url: "https://www.youtube.com/@李立庠"
    - name: linkedin
      url: "https://www.linkedin.com/in/你的帳號"
    - name: email
      url: "mailto:nicklee7963@gmail.com"

# 選單設定
menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: notes
      name: Learning Notes
      url: /notes/
      weight: 20
    - identifier: reading
      name: Reading List
      url: /reading/
      weight: 30
    - identifier: about
      name: Boxing & Fitness
      url: /about/
      weight: 40

# 這是最重要的部分：數學符號渲染設定
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
          - - $
            - $
