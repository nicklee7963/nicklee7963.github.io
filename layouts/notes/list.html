{{ define "main" }}

<div class="scroll-container">

    <section class="scroll-area section-hero" id="hero-section">
        <div class="content-wrapper center-layout">
            <h1 class="hero-title">{{ .Title }}</h1>
            <p class="hero-subtitle">Sharing my thoughts and technical notes.</p>
            <div class="scroll-hint">
                <span></span><span></span><span></span>
            </div>
        </div>
    </section>

    <section class="scroll-area list-section" id="list-section">
        <div class="content-wrapper left-layout">
            <h2 class="section-label">Latest Notes</h2>
            <div class="notes-grid">
                {{ range .Pages }}
                <article class="note-item-animation-wrapper">
                    <div class="note-card">
                        <span class="note-meta">{{ .Date.Format "Jan 02, 2006" }}</span>
                        <h3 class="note-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
                        <p class="note-summary">{{ .Summary | truncate 200 }}</p>
                        <a class="read-more" href="{{ .Permalink }}">Explore More →</a>
                    </div>
                </article>
                {{ end }}
            </div>
        </div>
    </section>

</div>

<style>
    /* --- 1. 破解標題與導覽列的寬度限制 --- */
    .header {
        position: fixed !important;
        top: 0; left: 0;
        width: 100% !important; /* 強制全頁面寬度 */
        max-width: none !important;
        z-index: 1000;
        background: transparent;
    }

    .nav {
        max-width: none !important;
        padding: 0 40px !important; /* 保持邊緣呼吸空間 */
    }

    .main { max-width: none !important; padding: 0 !important; margin: 0 !important; }
    html, body { overflow: hidden; height: 100%; width: 100%; }

    /* --- 2. 滾動容器與全螢幕設定 --- */
    .scroll-container {
        height: 100vh; width: 100vw;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
    }
    .scroll-container::-webkit-scrollbar { display: none; }

    .scroll-area {
        height: 100vh; width: 100%;
        scroll-snap-align: start;
        display: flex; justify-content: center; align-items: center;
        position: relative;
    }

    /* --- 3. 寬距統一 (1100px) --- */
    .content-wrapper { 
        width: 90%; 
        max-width: 1100px; 
    }
    
    .center-layout { text-align: center; }
    .left-layout { text-align: left; display: flex; flex-direction: column; align-items: flex-start; }

    /* --- 4. 樣式設計 --- */
    .hero-title { font-size: 6rem; font-weight: 900; margin-bottom: 10px; }
    .hero-subtitle { font-size: 1.5rem; opacity: 0.7; }
    
    .section-label { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); margin-bottom: 40px; }

    .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        width: 100%;
    }

    .note-card {
        padding: 25px;
        background: var(--entry);
        border: 1px solid var(--border);
        border-radius: 12px;
        transition: 0.3s;
    }
    .note-card:hover { transform: translateY(-5px); border-color: var(--primary); }
    .note-title { font-size: 1.5rem; margin: 10px 0; }
    .note-meta { font-family: monospace; font-size: 0.9rem; opacity: 0.6; }
    .note-summary { font-size: 0.95rem; line-height: 1.6; opacity: 0.8; margin-bottom: 20px; }
    .read-more { color: var(--primary); font-weight: bold; text-decoration: none; font-size: 0.9rem; }

    /* --- 5. 浮現動畫 (每次滾動觸發) --- */
    .hero-title, .hero-subtitle, .note-item-animation-wrapper, .section-label {
        opacity: 0;
        transform: translateY(40px);
        transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .visible .hero-title { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
    .visible .hero-subtitle { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
    .visible .section-label { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
    
    /* 筆記清單依序彈出 */
    .visible .note-item-animation-wrapper:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.2s; }
    .visible .note-item-animation-wrapper:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
    .visible .note-item-animation-wrapper:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.4s; }

    /* 箭頭提示 */
    .scroll-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); }
    .scroll-hint span { display: block; width: 18px; height: 18px; border-bottom: 2px solid var(--primary); border-right: 2px solid var(--primary); transform: rotate(45deg); margin: -8px; animation: arrow 2s infinite; }
    @keyframes arrow { 0% { opacity: 0; transform: rotate(45deg) translate(-15px, -15px); } 50% { opacity: 1; } 100% { opacity: 0; transform: rotate(45deg) translate(15px, 15px); } }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                } else {
                    entry.target.classList.remove('visible'); // 離開時移除，實現重複觸發
                }
            });
        }, { threshold: 0.3 });

        document.querySelectorAll('.scroll-area').forEach(section => observer.observe(section));
    });
</script>

{{ end }}
